[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "any2jev"
version = "0.1.0"
description = "Turn any open model into a Jev-style System One decision model: one forward pass, typed answers, calibrated probabilities."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "any2jev contributors" }]
keywords = ["jev", "system-one", "decision-model", "calibration", "non-autoregressive", "llm", "transformers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "transformers>=4.51",
  "peft>=0.14",
  "safetensors>=0.4",
  "pydantic>=2.7",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
data = ["datasets>=3.0"]
compat = ["typesafe-sdk>=0.7"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "datasets>=3.0"]

[project.scripts]
any2jev = "any2jev.cli:app"

[project.urls]
Homepage = "https://github.com/any2jev/any2jev"
Issues = "https://github.com/any2jev/any2jev/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/any2jev"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "B008", "UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
